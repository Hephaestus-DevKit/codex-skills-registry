name: registry-artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: export registry artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node dist/cli.js export --out codex-skills-registry-index.json
      - run: node dist/cli.js report --out codex-skills-registry-report.md
      - run: node dist/cli.js schema --out codex-skills-registry.schema.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-skills-registry-artifacts
          path: |
            codex-skills-registry-index.json
            codex-skills-registry-report.md
            codex-skills-registry.schema.json
